[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open-finance-banking"
version = "0.2.0"
description = "Read-only Pluggy financial data CLI for agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
]

[project.scripts]
pluggy-finance = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
